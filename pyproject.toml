[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "variabledetection"
version = "0.1.0"
description = "Automatic variable-star detection from calibrated FITS time series"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "photutils>=2.0",
    "sep",
    "astroalign",
    "auto-stretch",
    "astroquery",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
variabledetection = ["config.default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
